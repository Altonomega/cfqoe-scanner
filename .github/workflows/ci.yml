# CI for CFQoE Scanner.
#
# No dependency-install step on purpose: the project has zero runtime
# dependencies and no lockfile, so `npm ci` / `npm install` would fail or be
# meaningless. The syntax check and the test suite run directly on the
# checked-out sources with the matrix Node.js version.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check src/cli.js
      - name: Test suite
        run: npm test
